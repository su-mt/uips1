; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F411RE]
platform = ststm32
board = genericSTM32F411RE
framework = stm32cube

build_flags = 
    -std=c++17
    -fno-exceptions          ; Отключить exceptions (экономит память)
    -fno-rtti                ; Отключить RTTI (экономит память)
    -fno-threadsafe-statics  ; Для однопоточной среды
    -I cubemx/Core/Inc
    -I cubemx/Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -I cubemx/Drivers/CMSIS/Include
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D STM32CubeMX
    -Wl,-u,_printf_float     ; Включить поддержку float в printf
    -Wl,-u,_scanf_float

build_src_filter = 
    +<*>
    +<../cubemx/Core/Src/>
    -<../cubemx/Drivers/>
    -<../cubemx/Core/Src/main.c>        ; ИСКЛЮЧАЕМ main.c из CubeMX





; board_build.ldscript = cubemx/STM32F411RETX_FLASH.ld


debug_tool = stlink
upload_protocol = stlink


monitor_speed = 115200